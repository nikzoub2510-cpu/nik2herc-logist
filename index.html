  var cG=E.filter(function(e){return e.activity==="Consulting"&&e.type==="Έσοδο";}).reduce(function(s,e){return s+Number(e.totalInvoice||0);},0);
  var cW=E.filter(function(e){return e.activity==="Consulting"&&e.type==="Έσοδο";}).reduce(function(s,e){return s+Number(e.withholding||0);},0);
  return{kI:kI,kE:kE,cI:cI,cE:cE,cG:cG,cW:cW,net:(kI-kE)+(cI-cE)};
}

function mbar(act){

    i:E.filter(function(e){return e.activity===act&&e.type==="Έσοδο"&&new Date(e.date).getMonth()===i;}).reduce(function(s,e){return s+Number(e.amount||0);},0),

  };});
  var mx=Math.max.apply(null,d.map(function(x){return Math.max(x.i,x.e);}).concat([1]));
  return '<div class="mb">'+d.map(function(x,i){return '<div class="mc"><div class="mbs"><div class="bi" style="height:'+(x.i/mx*100)+'%"></div><div class="be" style="height:'+(x.e/mx*100)+'%"></div></div><div class="ml">'+MS[i]+'</div></div>';}).join('')+'</div>';
}

function sQD(qid,val){getVD().then(function(p){var i=p.findIndex(function(x){return x.qid===qid&&x.type==="due";});var e={qid:qid,type:"due",amount:pA(val),date:td()};if(i>=0)p[i]=e;else p.push(e);saveVD(p).then(function(){rTax();});});}
function aQP(qid){var date=document.getElementById("vd_aq").value,amt=document.getElementById("va_aq").value,desc=document.getElementById("vdesc_aq").value||"Καταβολή";if(!date||!amt)return;getVD().then(function(p){p.push({qid:qid,type:"payment",date:date,amount:pA(amt),description:desc});saveVD(p).then(function(){rTax();});});}
function dQP(qid,idx){getVD().then(function(p){var py=p.filter(function(x){return x.qid===qid&&x.type==="payment";});var rm=py[idx];saveVD(p.filter(function(x){return x!==rm;})).then(function(){rTax();});});}
function archQ(qid){getVD().then(function(p){p.push({qid:qid,type:"archived",date:td()});saveVD(p).then(function(){rTax();});});}
function unarchQ(qid){if(!confirm("Να διαγραφεί η αρχειοθέτηση;"))return;getVD().then(function(p){saveVD(p.filter(function(x){return x.qid!==qid;})).then(function(){rTax();});});}

          '<div><label class="fl2">Μηνιαίο Ενοίκιο (EUR)</label><input class="fi" id="eR'+n+'" value="'+(r.monthlyRent||"")+'" placeholder="0.00"></div>'+
        '</div>'
      :
        '<div style="margin-bottom:12px;padding:10px 12px;background:#F7F8FA;border-radius:8px">'+
          '<div style="font-size:11px;color:#6B7A8D">Ενοικιαστής</div>'+
          '<div style="font-size:14px;font-weight:600;margin-bottom:6px">'+(r.tenant||"—")+'</div>'+
          (r.deh?'<div style="font-size:11px;color:#6B7A8D">Αρ. Παροχής ΔΕΗ</div><div style="font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:6px">'+r.deh+'</div>':"")+
          '<div style="font-size:11px;color:#6B7A8D">Μηνιαίο Ενοίκιο</div>'+
          '<div style="font-size:16px;font-weight:700;color:#1A4E8B">'+fmt(du)+'</div>'+
        '</div>'
      )+
      '<div style="background:'+sBg+';border-radius:8px;padding:7px 12px;text-align:center;margin-bottom:12px;font-weight:700;color:'+sC+'">'+sTx+' — '+fmt(mp)+' / '+fmt(du)+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
        '<div style="background:#E8F5EE;border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:#6B7A8D">Σύνολο Εισπράξεων</div><div style="font-size:14px;font-weight:700;color:#1A6B3C">'+fmt(tp)+'</div></div>'+
        '<div style="background:#FDF0F0;border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:#6B7A8D">Έξοδα</div><div style="font-size:14px;font-weight:700;color:#8B1A1A">'+fmt(te)+'</div></div>'+
      '</div>'+
      '<div style="background:#F7F8FA;border-radius:8px;padding:10px;margin-bottom:8px">'+
        '<div class="fl2" style="margin-bottom:6px">Νέα Πληρωμή</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">'+
          '<div><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Ημερομηνία</label><input class="fi" type="date" id="rpD'+n+'" value="'+td()+'" style="font-size:12px;padding:7px"></div>'+
          '<div><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Ποσό (EUR)</label><input class="fi" type="text" id="rpA'+n+'" placeholder="Ποσό" style="font-size:12px;padding:7px"></div>'+
        '</div>'+
        '<div style="margin-bottom:6px"><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Αφορά Μήνα</label>'+
          '<select class="fi" id="rpM'+n+'" style="font-size:12px;padding:7px">'+
            MF.map(function(m,i){var v=new Date().getFullYear()+"-"+String(i+1).padStart(2,"0");return '<option value="'+v+'" '+(i===new Date().getMonth()?"selected":"")+'>'+m+' '+new Date().getFullYear()+'</option>';}).join("")+
          '</select></div>'+
        '<button onclick="aRP('+n+')" style="width:100%;background:#1A6B3C;color:#fff;border:none;padding:7px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">+ Πληρωμή</button>'+
      '</div>'+
      '<button onclick="sRH('+n+')" style="width:100%;background:#1B2A4A;color:#fff;border:none;padding:7px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600">📋 Ιστορικό Πληρωμών</button>'+
    '</div>';
  });
  h+='</div>'+
  '<div class="card"><div class="stitle">📝 Έξοδα Ακινήτων</div>'+
    '<div style="background:#F7F8FA;border-radius:8px;padding:14px;margin-bottom:14px">'+
      '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end">'+
        '<div><label class="fl2">Περιγραφή</label><input class="fi" id="reD" placeholder="π.χ. Νερό..."></div>'+
        '<div><label class="fl2">Σπίτι</label><select class="fi" id="reH"><option value="1">Σπίτι 1</option><option value="2">Σπίτι 2</option><option value="3">Σπίτι 3</option><option value="0">Κοινό</option></select></div>'+
        '<div><label class="fl2">Ημερομηνία</label><input class="fi" type="date" id="reDA" value="'+td()+'"></div>'+
        '<div><label class="fl2">Ποσό (EUR)</label><input class="fi" type="text" id="reA" placeholder="0.00"></div>'+
      '</div>'+
      '<button onclick="aRE()" style="margin-top:10px;background:#8B1A1A;color:#fff;border:none;padding:9px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">+ Καταχώρηση Εξόδου</button>'+
    '</div>'+
    '<div style="margin-bottom:8px;font-size:13px;color:#6B7A8D">Σύνολο: <strong style="color:#8B1A1A">'+fmt(tE)+'</strong></div>'+
    '<div class="tw"><table class="tbl">'+
      '<thead><tr><th>Ημερομηνία</th><th>Σπίτι</th><th>Περιγραφή</th><th style="text-align:right">Ποσό</th><th></th></tr></thead>'+
      '<tbody>'+(RE.length===0?'<tr><td colspan="5" style="padding:20px;text-align:center;color:#6B7A8D">Δεν υπάρχουν</td></tr>':"")+
        [].concat(RE).sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(e,i){
          return '<tr style="background:'+(i%2===0?"#fff":"#F7F8FA")+'">'+
            '<td>'+e.date.split("-").reverse().join("/")+'</td>'+
            '<td>'+(e.houseId==="house_0"?"Κοινό":"Σπίτι "+e.houseId.replace("house_",""))+'</td>'+
            '<td>'+(e.category||"-")+'</td>'+
            '<td style="text-align:right;font-weight:700;color:#8B1A1A">'+fmt(e.amount)+'</td>'+
            '<td><button onclick="dRE(\''+e.id+'\')" style="background:none;border:none;cursor:pointer;color:#ccc">🗑</button></td>'+
          '</tr>';
        }).join("")+
      '</tbody></table></div>'+
  '</div>';
  if(rentHist){
    var r=RD.filter(function(r){return r.id==="house_"+rentHist;})[0]||{tenant:""};
    var it=RP.filter(function(p){return p.houseId==="house_"+rentHist;}).sort(function(a,b){return b.date.localeCompare(a.date);});
    var tot=it.reduce(function(s,i){return s+Number(i.amount);},0);
    h+='<div class="card" style="border:2px solid #1B2A4A">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
        '<div style="font-size:14px;font-weight:700;color:#1B2A4A">🏠 Σπίτι '+rentHist+' — '+(r.tenant||"")+' — Ιστορικό Πληρωμών</div>'+
        '<button onclick="cRH()" style="background:#F0F0F0;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600">✕</button>'+
      '</div>'+
      '<div style="margin-bottom:8px;font-size:13px">Σύνολο: <strong style="color:#1A6B3C">'+fmt(tot)+'</strong></div>'+
      '<div class="tw"><table class="tbl">'+
        '<thead><tr><th>Ημ. Πληρωμής</th><th>Αφορά</th><th style="text-align:right">Ποσό</th><th></th></tr></thead>'+
        '<tbody>'+(it.length===0?'<tr><td colspan="4" style="padding:20px;text-align:center;color:#6B7A8D">Δεν υπάρχουν</td></tr>':"")+
          it.map(function(p,i){
            return '<tr style="background:'+(i%2===0?"#fff":"#F7F8FA")+'">'+
              '<td>'+p.date.split("-").reverse().join("/")+'</td>'+
              '<td style="color:#6B7A8D">'+(p.month?MF[parseInt(p.month.split("-")[1])-1]+" "+p.month.split("-")[0]:"-")+'</td>'+
              '<td style="text-align:right;font-weight:700;color:#1A6B3C">'+fmt(p.amount)+'</td>'+
              '<td><button onclick="dRP(\''+p.id+'\')" style="background:none;border:none;cursor:pointer;color:#ccc">🗑</button></td>'+
            '</tr>';
          }).join("")+
        '</tbody></table></div>'+
    '</div>';
  }
  document.getElementById("v-rents").innerHTML=h;
}
function tER(n){
  if(editRent===n){
    var t=document.getElementById("eT"+n).value.trim()||"";
    var deh=document.getElementById("eDEH"+n).value.trim()||"";
    var mr=r2(pA(document.getElementById("eR"+n).value||"0"));
    var id="house_"+n;
    var ex=RD.filter(function(r){return r.id===id;})[0]||{id:id};
    ex.tenant=t;ex.deh=deh;ex.monthlyRent=mr;
    var i=RD.findIndex(function(r){return r.id===id;});if(i>=0)RD[i]=ex;else RD.push(ex);
    fbs("rents_2026",id,ex).then(function(){editRent=null;rRents();});
  }else{editRent=n;rRents();}
}
function aRP(n){
  var date=document.getElementById("rpD"+n).value,amt=document.getElementById("rpA"+n).value;
  var month=document.getElementById("rpM"+n).value||date.slice(0,7);
  if(!date||!amt)return;
  var p={id:uid(),houseId:"house_"+n,date:date,month:month,amount:r2(pA(amt))};
  RP.push(p);
  fbs("rent_payments_2026",p.id,p).then(function(){document.getElementById("rpA"+n).value="";rRents();});
}
function dRP(id){RP=RP.filter(function(p){return p.id!==id;});fbd("rent_payments_2026",id).then(function(){rRents();});}
function sRH(n){rentHist=n;rRents();}
function cRH(){rentHist=null;rRents();}
function aRE(){
  var d=document.getElementById("reD").value.trim(),h=document.getElementById("reH").value;
  var da=document.getElementById("reDA").value,a=document.getElementById("reA").value;
  if(!d||!da||!a)return;
  var e={id:uid(),houseId:"house_"+h,date:da,category:d,amount:r2(pA(a))};
  RE.push(e);fbs("rent_expenses_2026",e.id,e).then(function(){document.getElementById("reD").value="";document.getElementById("reA").value="";rRents();});
}
function dRE(id){RE=RE.filter(function(e){return e.id!==id;});fbd("rent_expenses_2026",id).then(function(){rRents();});}

// ── BACKUP ────────────────────────────────────────────────
function rBackup(){
  document.getElementById("v-backup").innerHTML=
    '<div style="max-width:800px;margin:0 auto"><div class="card">'+
    '<div class="stitle">⬇ Backup Δεδομένων</div>'+
    '<p style="font-size:13px;color:#6B7A8D;margin-bottom:12px">Κλικ μέσα → Ctrl+A → Ctrl+C → Σημειωματάριο → Αποθήκευση ως backup.json</p>'+
    '<textarea readonly style="width:100%;height:380px;font-family:monospace;font-size:11px;padding:12px;border:1px solid #DDE4ED;border-radius:8px;background:#F7F8FA;resize:vertical" onclick="this.select()">'+JSON.stringify(E,null,2)+'</textarea>'+
    '<button onclick="ST(\'dashboard\')" style="margin-top:12px;padding:8px 16px;border:1px solid #DDE4ED;background:transparent;border-radius:8px;cursor:pointer">← Πίσω</button>'+
    '</div></div>';
}

function importJ(ev){
  var f=ev.target.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);
      sm("Εισαγωγή "+d.length+"...","#FFD700");
      var p=Promise.resolve();
      d.forEach(function(x){p=p.then(function(){return fbs(COL,x.id,x);});});
      p.then(function(){sm("Εισήχθησαν "+d.length,"#90EE90");});
    }catch(err){alert("Σφάλμα αρχείου");}
  };
  reader.readAsText(f);ev.target.value="";
}

// ── VIEW SWITCHING ────────────────────────────────────────
function ST(v){
  curView=v;
  ["dashboard","tax","entries","add","rents","backup"].forEach(function(n){
    var el=document.getElementById("v-"+n);if(el)el.style.display=n===v?"block":"none";
  });
  document.querySelectorAll(".nb").forEach(function(b,i){
    b.classList.toggle("on",["dashboard","tax","entries","add","rents"][i]===v);
  });
  if(v==="dashboard") rDash();
  else if(v==="tax") rTax();
  else if(v==="entries") rEnt();
  else if(v==="add") rAdd();
  else if(v==="rents") loadR().then(function(){rRents();});
  else if(v==="backup") rBackup();
}

// ── INIT ──────────────────────────────────────────────────
sm("Σύνδεση...","#FFD700");
seedE().then(function(){
  db.collection(COL).onSnapshot(function(snap){
    E=snap.docs.map(function(d){return d.data();}).sort(function(a,b){return a.date.localeCompare(b.date);});
    sm("☁ Συνδεδεμένο","#90EE90");
    if(curView==="dashboard") rDash();
    else if(curView==="entries") rEnt();
  },function(){sm("✗ Offline","#FF8080");});
});
</script>
