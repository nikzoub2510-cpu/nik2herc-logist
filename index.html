<script>
var PIN="040697";
function pp(k){var i=document.getElementById("pi");if(!i||i.value.length>=6)return;i.value+=String(k);if(i.value.length===6)pc();}
function pd(){var i=document.getElementById("pi");if(i)i.value=i.value.slice(0,-1);}
function pic(v){if(v.length===6)pc();}
function pc(){
  var i=document.getElementById("pi"),e=document.getElementById("pe");
  if(!i)return;
  if(i.value===PIN){document.getElementById("po").style.display="none";}
  else{if(e)e.textContent="Λάθος κωδικός";i.value="";i.style.borderColor="#8B1A1A";
    setTimeout(function(){if(e)e.textContent="";i.style.borderColor="";i.focus();},1500);}
}
function changeYear(){
  var cur=document.getElementById("yr").textContent;
  var n=prompt("Αλλαγή χρονιάς (τώρα: "+cur+")\nΝέα χρονιά:",String(Number(cur)+1));
  if(n&&!isNaN(Number(n)))document.getElementById("yr").textContent=n;
}
window.addEventListener("load",function(){setTimeout(function(){var i=document.getElementById("pi");if(i)i.focus();},300);});
</script>

<div id="po" class="po">

    <div style="font-size:40px;margin-bottom:8px">&#128272;</div>
    <div style="font-size:18px;font-weight:700;color:#1B2A4A;margin-bottom:4px">Λογιστήριο</div>
    <div style="font-size:12px;color:#6B7A8D;margin-bottom:20px">Νίκος Ζουμπουλάκης</div>
    <input class="pi" id="pi" type="password" maxlength="6" inputmode="numeric" placeholder="&#8226; &#8226; &#8226; &#8226; &#8226; &#8226;" autocomplete="off" oninput="pic(this.value)" onkeydown="if(event.key==='Enter')pc()">
    <div class="pg">
      <button class="pkb" onclick="pp(1)">1</button><button class="pkb" onclick="pp(2)">2</button><button class="pkb" onclick="pp(3)">3</button>
      <button class="pkb" onclick="pp(4)">4</button><button class="pkb" onclick="pp(5)">5</button><button class="pkb" onclick="pp(6)">6</button>

    </div>
    <div class="pe" id="pe"></div>

</div>

// ── AGGREGATES ─────────────────────────────────────────────
const sumAmt=fn=>E.filter(fn).reduce((s,e)=>s+Number(e.amount||0),0);
const sumVat=fn=>E.filter(fn).reduce((s,e)=>s+Number(e.vat||0),0);

function agg(){
  const kI=sumAmt(e=>e.activity==="Κατοικία"&&e.type==="Έσοδο");
  const kE=sumAmt(e=>e.activity==="Κατοικία"&&e.type==="Έξοδο");
  const cI=sumAmt(e=>e.activity==="Consulting"&&e.type==="Έσοδο");
  const cE=sumAmt(e=>e.activity==="Consulting"&&e.type==="Έξοδο");
  const cG=E.filter(e=>e.activity==="Consulting"&&e.type==="Έσοδο").reduce((s,e)=>s+Number(e.totalInvoice||0),0);
  const cW=E.filter(e=>e.activity==="Consulting"&&e.type==="Έσοδο").reduce((s,e)=>s+Number(e.withholding||0),0);
  return{kI,kE,cI,cE,cG,cW,net:(kI-kE)+(cI-cE)};
}

function mbar(act){
  const d=MS.map((_,i)=>({
    i:E.filter(e=>e.activity===act&&e.type==="Έσοδο"&&new Date(e.date).getMonth()===i).reduce((s,e)=>s+Number(e.amount||0),0),
    e:E.filter(e=>e.activity===act&&e.type==="Έξοδο"&&new Date(e.date).getMonth()===i).reduce((s,e)=>s+Number(e.amount||0),0),
  }));
  const mx=Math.max(...d.flatMap(x=>[x.i,x.e]),1);
  return`<div class="mb">${d.map((x,i)=>`<div class="mc"><div class="mbs"><div class="bi" style="height:${(x.i/mx)*100}%"></div><div class="be" style="height:${(x.e/mx)*100}%"></div></div><div class="ml">${MS[i]}</div></div>`).join("")}</div>`;
}

      <div style="font-size:13px;font-weight:600;color:#8B1A1A">&#8595; ${fmt(totX)}</div>

      <th>Τύπος</th>
      <th>Περιγραφή / Προμηθευτής</th>

  // Filter pill buttons via DOM
  const actPills=[["Όλες","Όλες"],["Κατοικία","Κατοικία"],["Consulting","Consulting"],["Εκτός","Εκτός Δραστηριότητας"]];
  const actDiv=document.getElementById("flt-act");

    const b=document.createElement("button");

    b.textContent=label;
    b.addEventListener("click",()=>{filt.activity=val;rEnt();});

  });
  const typeDiv=document.getElementById("flt-type");
  [["Όλοι","Όλοι","an"],["Έσοδο","Έσοδο","ag"],["Έξοδο","Έξοδο","ar"]].forEach(([label,val,cls])=>{
    const b=document.createElement("button");
    b.className="pl"+(filt.type===val?" "+cls:"");
    b.textContent=label;
    b.addEventListener("click",()=>{filt.type=val;rEnt();});

  });
  document.getElementById("flt-mon")?.addEventListener("change",ev=>{filt.month=ev.target.value;rEnt();});
  document.getElementById("flt-sup")?.addEventListener("change",ev=>{filt.supplier=ev.target.value;rEnt();});

  const tbody=document.getElementById("ent-body");

    td.textContent="Δεν βρέθηκαν εγγραφές";
    tr.appendChild(td);tbody.appendChild(tr);return;
  }

  fil.forEach((e,i)=>{
    const isIncome=e.type==="Έσοδο";
    const bg=isIncome?(i%2===0?"#F0FBF4":"#E4F5EC"):(e.invoice?(i%2===0?"#fff":"#F7F8FA"):(i%2===0?"#FEFAE8":"#FDF5D8"));
    const ex=expanded.has(e.id);
    const dd=e.date?e.date.slice(0,10).split("-").reverse().join("/"):"";
    const vatAmt=Number(e.vat||0);
    const dispAmt=Number(e.amount||0);

    const tr=document.createElement("tr");
    tr.style.cssText=`background:${bg}`;

    // X delete button
    const tdX=document.createElement("td");
    tdX.style.cssText="text-align:center;padding:4px";
    const xb=document.createElement("button");
    xb.className="xbtn";xb.textContent="✕";
    xb.addEventListener("click",async ev=>{
      ev.stopPropagation();
      if(!confirm(`Διαγραφή εγγραφής:\n"${e.description}" — ${fmt(dispAmt)}`))return;
      try{
        await window._deleteDoc(window._doc(window._db,COL,e.id));
      }catch(err){alert("Σφάλμα: "+err.message);}
    });
    tdX.appendChild(xb);tr.appendChild(tdX);

    // Date
    const tdD=document.createElement("td");
    tdD.style.cssText="white-space:nowrap;cursor:pointer";
    tdD.textContent=(ex?"▾ ":"▸ ")+dd;
    tdD.addEventListener("click",()=>{expanded.has(e.id)?expanded.delete(e.id):expanded.add(e.id);rEnt();});
    tr.appendChild(tdD);

    // Activity
    const tdA=document.createElement("td");
    tdA.style.cursor="pointer";
    const spanA=document.createElement("span");
    spanA.className="tag";

    spanA.textContent=(e.activity==="Κατοικία"?"🏠":e.activity==="Consulting"?"💼":"📦")+" "+e.activity;
    tdA.appendChild(spanA);tdA.addEventListener("click",()=>{expanded.has(e.id)?expanded.delete(e.id):expanded.add(e.id);rEnt();});
    tr.appendChild(tdA);

    // Type
    const tdT=document.createElement("td");
    tdT.style.cursor="pointer";

    spanT.className="tag";
    spanT.style.cssText=`background:${isIncome?"#E8F5EE":"#FDF0F0"};color:${isIncome?"#1A6B3C":"#8B1A1A"}`;
    spanT.textContent=e.type;
    tdT.appendChild(spanT);tdT.addEventListener("click",()=>{expanded.has(e.id)?expanded.delete(e.id):expanded.add(e.id);rEnt();});
    tr.appendChild(tdT);

    // Description / Supplier
    const tdDesc=document.createElement("td");
    tdDesc.style.cursor="pointer";
    tdDesc.innerHTML=`<div style="font-size:12px">${e.description||"-"}</div><div style="font-size:10px;color:#9CA3AF">${e.supplier||""}</div>`;

    tr.appendChild(tdDesc);

    // Amount
    const tdAmt=document.createElement("td");
    tdAmt.style.cssText=`text-align:right;font-weight:700;color:${isIncome?"#1A6B3C":"#8B1A1A"}`;
    tdAmt.textContent=fmt(dispAmt);
    tr.appendChild(tdAmt);

    tbody.appendChild(tr);

    // Expanded detail row
    if(ex){
      const trEx=document.createElement("tr");
      const tdEx=document.createElement("td");
      tdEx.colSpan=7;tdEx.className="dc";
      tdEx.style.background=isIncome?"#D8F2E4":"#ECECEC";
      const wh=Number(e.withholding||0);
      const ti=Number(e.totalInvoice||0);
      tdEx.innerHTML=`<div class="dg">
        <div><span class="dlb">Κατηγορία</span>${e.category||"-"}</div>
        <div><span class="dlb">Προμηθευτής/Πελάτης</span>${e.supplier||"-"}</div>
        <div><span class="dlb">Παραστατικό</span><span class="tag" style="background:${e.invoice?"#E8F5EE":"#FEFAE8"};color:${e.invoice?"#1A6B3C":"#B8860B"}">${e.invoice?"✓ Ναι":"✗ Όχι"}</span></div>
        <div><span class="dlb">ΦΠΑ %</span>${e.vatPct!==undefined?e.vatPct+"%":"-"}</div>
        <div><span class="dlb">Καθαρή (προ ΦΠΑ)</span>${fmt(e.net||0)}</div>
        <div><span class="dlb">ΦΠΑ ποσό</span>${fmt(vatAmt)}</div>
        ${ti?`<div><span class="dlb">Σύνολο τιμολογίου</span>${fmt(ti)}</div>`:""}
        ${wh?`<div><span class="dlb">Παρακράτηση</span>-${fmt(wh)}</div>`:""}
        <div><span class="dlb">Ποσό εγγραφής</span><strong>${fmt(dispAmt)}</strong></div>
        ${e.note?`<div style="grid-column:1/-1"><span class="dlb">Σημείωση</span>${e.note}</div>`:""}
      </div>`;
      trEx.appendChild(tdEx);tbody.appendChild(trEx);
    }
  });
}

function updWithRow(){
  // Show withholding row only for income
  const row=document.getElementById("withRow");
  if(row)row.style.display=fType==="Έσοδο"?"":"none";
}

function setType(t){
  fType=t;
  const bEx=document.getElementById("bEx"),bEs=document.getElementById("bEs");
  if(bEx)bEx.className="tb"+(t==="Έξοδο"?" ex":"");
  if(bEs)bEs.className="tb"+(t==="Έσοδο"?" es":"");
  const sLbl=document.getElementById("sLbl");if(sLbl)sLbl.textContent=t==="Έξοδο"?"Προμηθευτής":"Πελάτης";
  const aLbl=document.getElementById("amtLbl");if(aLbl)aLbl.textContent="Τελική Αξία (με ΦΠΑ) *";
  updWithRow();uC();uP();
}

function uC(){
  const cats=(CATS[fAct]?.[fType]||[]).concat(extraCats[fAct]?.[fType]||[]);
  const s=document.getElementById("fC");if(!s)return;
  s.innerHTML=`<option value="">-- Επιλέξτε --</option>`+cats.map(c=>`<option>${c}</option>`).join("");
}

function uP(){
  const entered=pA(document.getElementById("fAV")?.value||"");
  const vp=parseInt(document.getElementById("fV")?.value||"24");
  const whChecked=document.getElementById("fWH")?.checked||false;
  const whAmt=whChecked?pA(document.getElementById("fWHamt")?.value||""):0;
  const box=document.getElementById("pB");if(!box)return;
  if(entered<=0){box.style.display="none";return;}
  box.style.display="block";box.className="fu";

  // Ποσά:
  // totalInvoice = entered (τελική αξία με ΦΠΑ)
  // net = entered / (1 + vp/100)   — για ΕΞΟΔΑ: αξία χωρίς ΦΠΑ
  // vat = totalInvoice - net
  // withholding = whAmt (manual)
  // amount (εγγραφή) = totalInvoice - whAmt

  const net=r2(entered/(1+vp/100));
  const vatAmt=r2(entered-net);
  const finalAmt=r2(entered-whAmt);

  if(fType==="Έξοδο"){
    box.style.cssText="grid-column:1/-1;background:#FDF0F0;border:1px solid #F0C0C0;border-radius:8px;padding:10px 14px";
    box.innerHTML=`<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:#6B7A8D">Καθαρή (προ ΦΠΑ): <strong>${fmt(net)}</strong></span>
      <span style="font-size:12px;color:#6B7A8D">ΦΠΑ ${vp}%: <strong style="color:#1A4E8B">${fmt(vatAmt)}</strong></span>
      <span style="font-size:15px;font-weight:700;color:#8B1A1A;margin-left:auto">Καταχωρείται: ${fmt(finalAmt)}</span>
    </div>`;
  }else{
    box.style.cssText="grid-column:1/-1;background:#E8F5EE;border:1px solid #A8D5BA;border-radius:8px;padding:10px 14px";
    let html=`<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:#6B7A8D">Καθαρή (προ ΦΠΑ): <strong>${fmt(net)}</strong></span>
      <span style="font-size:12px;color:#6B7A8D">ΦΠΑ ${vp}%: <strong style="color:#1A4E8B">${fmt(vatAmt)}</strong></span>`;
    if(whAmt>0)html+=`<span style="font-size:12px;color:#6B7A8D">Παρακράτηση: <strong style="color:#8B1A1A">-${fmt(whAmt)}</strong></span>`;
    html+=`<span style="font-size:15px;font-weight:700;color:#1A6B3C;margin-left:auto">Καταχωρείται: ${fmt(finalAmt)}</span></div>`;
    box.innerHTML=html;
  }
}

function uI(){
  const ch=document.getElementById("fI")?.checked;
  const b=document.getElementById("iB"),l=document.getElementById("iL");if(!b||!l)return;fInv=!!ch;
  if(ch){b.style.cssText="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #A8D5BA;background:#E8F5EE";l.style.color="#1A6B3C";l.textContent="✅ Υπάρχει παραστατικό";}
  else{b.style.cssText="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid #E8D080;background:#FEFAE8";l.style.color="#B8860B";l.textContent="⚠️ Χωρίς παραστατικό";}
}

async function doSv(){
  const desc=document.getElementById("fDe")?.value.trim();
  const entStr=document.getElementById("fAV")?.value.trim();
  const eB=document.getElementById("eB");
  if(!desc||!entStr){if(eB){eB.textContent="Συμπληρώστε Περιγραφή και Αξία";eB.style.display="block";}return;}
  if(eB)eB.style.display="none";

  const entered=pA(entStr);  // τελική αξία με ΦΠΑ (πάντα)
  const vp=parseInt(document.getElementById("fV")?.value||"24");
  const whChecked=document.getElementById("fWH")?.checked||false;
  const whAmt=whChecked?r2(pA(document.getElementById("fWHamt")?.value||"0")):0;

  // Υπολογισμός:
  // net = entered / (1 + vp/100)
  // vat = entered - net
  // totalInvoice = entered
  // withholding = whAmt
  // amount = totalInvoice - withholding  ← αυτό φαίνεται στις εγγραφές
  const net=r2(entered/(1+vp/100));
  const vatAmt=r2(entered-net);
  const amount=r2(entered-whAmt);

  const dy=String(document.getElementById("fD")?.value||"1").padStart(2,"0");
  const mn=document.getElementById("fM")?.value||"01";
  const yr=document.getElementById("fY")?.value||"2026";
  const newId=uid();

  sm("Αποθήκευση...","#FFD700");
  try{
    await fbs(COL,newId,{
      id:newId,
      date:`${yr}-${mn}-${dy}`,
      activity:fAct,
      type:fType,
      category:document.getElementById("fC")?.value||"",
      description:desc,
      supplier:ddSup,
      invoice:fInv,
      note:document.getElementById("fN")?.value.trim()||"",
      totalInvoice:entered,
      net,
      vat:vatAmt,
      vatPct:vp,
      withholding:whAmt,
      amount,
    });
    // Reset
    document.getElementById("fAV").value="";
    document.getElementById("fDe").value="";
    document.getElementById("fN").value="";
    document.getElementById("fC").value="";
    document.getElementById("fI").checked=false;
    const fwh=document.getElementById("fWH");if(fwh)fwh.checked=false;
    const fwha=document.getElementById("fWHamt");if(fwha){fwha.value="";fwha.style.display="none";}
    fInv=false;ddSup="";
    const v=document.getElementById("ddV");if(v){v.textContent="-- Επιλέξτε --";v.style.color="#9CA3AF";}
    uI();uP();
    const ob=document.getElementById("okB");if(ob){ob.style.display="flex";setTimeout(()=>ob.style.display="none",3000);}
    document.getElementById("fDe")?.focus();
  }catch(err){alert("Σφάλμα αποθήκευσης: "+err.message);}
}

function acat(){
  const n=prompt("Νέα κατηγορία:");if(!n?.trim())return;
  if(!extraCats[fAct])extraCats[fAct]={};
  if(!extraCats[fAct][fType])extraCats[fAct][fType]=[];
  extraCats[fAct][fType].push(n.trim());
  uC();const s=document.getElementById("fC");if(s)s.value=n.trim();
}

// ── DROPDOWN ───────────────────────────────────────────────
function ddT(){const m=document.getElementById("ddM");m.classList.toggle("op");if(m.classList.contains("op")){ddRL("");setTimeout(()=>document.getElementById("ddSr")?.focus(),50);}}
function ddCl(){document.getElementById("ddM")?.classList.remove("op");ddHN();}
function ddRL(srch){
  const l=document.getElementById("ddL");if(!l)return;
  const s=sups().filter(x=>x.toLowerCase().includes((srch||"").toLowerCase()));
  if(!s.length){l.innerHTML=`<div style="padding:10px 12px;font-size:12px;color:#9CA3AF">Δεν βρέθηκε</div>`;return;}
  l.innerHTML="";
  s.forEach(x=>{const d=document.createElement("div");d.className="ddi"+(ddSup===x?" sel":"");d.textContent=x;d.addEventListener("click",()=>ddP(x));l.appendChild(d);});
}
function ddP(s){ddSup=s;const v=document.getElementById("ddV");if(v){v.textContent=s;v.style.color="#1A2332";}ddCl();}
function ddSN(){const b=document.getElementById("ddAB"),r=document.getElementById("ddNR");if(b)b.style.display="none";if(r)r.style.display="flex";setTimeout(()=>document.getElementById("ddNI")?.focus(),50);}
function ddHN(){const b=document.getElementById("ddAB"),r=document.getElementById("ddNR");if(b)b.style.display="";if(r)r.style.display="none";}
function ddCN(){const n=document.getElementById("ddNI")?.value.trim();if(n){extraSups.push(n);ddP(n);}}
document.addEventListener("click",ev=>{const w=document.getElementById("ddW");if(w&&!w.contains(ev.target))ddCl();});

// ── RENTS ──────────────────────────────────────────────────
async function loadR(){[RD,RP,RE]=await Promise.all([fbg("rents_2026"),fbg("rent_payments_2026"),fbg("rent_expenses_2026")]);}
function rRents(){
  const cm=new Date().toISOString().slice(0,7);
  const tE=RE.reduce((s,e)=>s+Number(e.amount),0);
  const tEx=[1,2,3].reduce((s,n)=>{const r=RD.find(r=>r.id==="house_"+n)||{monthlyRent:0};return s+Number(r.monthlyRent||0);},0);
  const tC=RP.filter(p=>p.month===cm).reduce((s,p)=>s+Number(p.amount),0);
  let h=`<div class="g3" style="margin-bottom:16px">
    <div class="sc" style="background:#EBF2FB;border-color:#BDD4F0"><div class="sl">Αναμενόμενα/μήνα</div><div class="sv" style="color:#1A4E8B">${fmt(tEx)}</div></div>
    <div class="sc" style="background:${tC>=tEx&&tEx>0?"#E8F5EE":"#FDF0F0"};border-color:${tC>=tEx&&tEx>0?"#A8D5BA":"#F0C0C0"}"><div class="sl">Εισπράχθηκαν ${new Date().toLocaleDateString("el-GR",{month:"long"})}</div><div class="sv" style="color:${tC>=tEx&&tEx>0?"#1A6B3C":"#8B1A1A"}">${fmt(tC)}</div></div>
    <div class="sc" style="background:#FDF0F0;border-color:#F0C0C0"><div class="sl">Συνολικά Έξοδα</div><div class="sv" style="color:#8B1A1A">${fmt(tE)}</div></div>
  </div><div class="g3" style="margin-bottom:16px">`;
  [1,2,3].forEach(n=>{
    const r=RD.find(r=>r.id==="house_"+n)||{id:"house_"+n,tenant:"",monthlyRent:0,deh:""};
    const mp=RP.filter(p=>p.houseId==="house_"+n&&p.month===cm).reduce((s,p)=>s+Number(p.amount),0);
    const du=Number(r.monthlyRent)||0;
    const st=mp>=du&&du>0?"paid":mp>0?"part":"un";
    const sC=st==="paid"?"#1A6B3C":st==="part"?"#B8860B":"#8B1A1A";
    const sBg=st==="paid"?"#E8F5EE":st==="part"?"#FEFAE8":"#FDF0F0";
    const sBd=st==="paid"?"#A8D5BA":st==="part"?"#E8D080":"#F0C0C0";
    const sTx=st==="paid"?"✓ Πληρώθηκε":st==="part"?"⚠ Μερική":"✗ Δεν πληρώθηκε";
    const isEd=editRent===n;
    const tp=RP.filter(p=>p.houseId==="house_"+n).reduce((s,p)=>s+Number(p.amount),0);
    const te=RE.filter(e=>e.houseId==="house_"+n).reduce((s,e)=>s+Number(e.amount),0);
    h+=`<div class="card" style="border:2px solid ${sBd}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;color:#1B2A4A">&#127968; Σπίτι ${n}</div>
        <button onclick="window.tER(${n})" style="background:#EBF2FB;color:#1A4E8B;border:1px solid #BDD4F0;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600">${isEd?"&#128190; Αποθήκευση":"&#9998; Επεξεργασία"}</button>
      </div>
      ${isEd?`<div style="background:#F7F8FA;border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="margin-bottom:8px"><label class="fl2">Ενοικιαστής</label><input class="fi" id="eT${n}" value="${r.tenant||""}" placeholder="Όνομα"></div>
        <div style="margin-bottom:8px"><label class="fl2">Αρ. Παροχής ΔΕΗ</label><input class="fi" id="eDEH${n}" value="${r.deh||""}" placeholder="π.χ. 12345678"></div>
        <div><label class="fl2">Μηνιαίο Ενοίκιο (EUR)</label><input class="fi" id="eR${n}" value="${r.monthlyRent||""}" placeholder="0.00"></div>
      </div>`:`<div style="margin-bottom:12px;padding:10px 12px;background:#F7F8FA;border-radius:8px">
        <div style="font-size:11px;color:#6B7A8D">Ενοικιαστής</div>
        <div style="font-size:14px;font-weight:600;margin-bottom:6px">${r.tenant||"—"}</div>
        ${r.deh?`<div style="font-size:11px;color:#6B7A8D">Αρ. Παροχής ΔΕΗ</div><div style="font-size:13px;font-weight:600;color:#1B2A4A;margin-bottom:6px">${r.deh}</div>`:""}
        <div style="font-size:11px;color:#6B7A8D">Μηνιαίο Ενοίκιο</div>
        <div style="font-size:16px;font-weight:700;color:#1A4E8B">${fmt(du)}</div>
      </div>`}
      <div style="background:${sBg};border-radius:8px;padding:7px 12px;text-align:center;margin-bottom:12px;font-weight:700;color:${sC}">${sTx} — ${fmt(mp)} / ${fmt(du)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:#E8F5EE;border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:#6B7A8D">Σύνολο Εισπράξεων</div><div style="font-size:14px;font-weight:700;color:#1A6B3C">${fmt(tp)}</div></div>
        <div style="background:#FDF0F0;border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:#6B7A8D">Έξοδα</div><div style="font-size:14px;font-weight:700;color:#8B1A1A">${fmt(te)}</div></div>
      </div>
      <div style="background:#F7F8FA;border-radius:8px;padding:10px;margin-bottom:8px">
        <div class="fl2" style="margin-bottom:6px">Νέα Πληρωμή</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
          <div><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Ημερομηνία Πληρωμής</label><input class="fi" type="date" id="rpD${n}" value="${td()}" style="font-size:12px;padding:7px"></div>
          <div><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Ποσό (EUR)</label><input class="fi" type="text" id="rpA${n}" placeholder="Ποσό" style="font-size:12px;padding:7px"></div>
        </div>
        <div style="margin-bottom:6px"><label style="font-size:10px;color:#6B7A8D;display:block;margin-bottom:2px">Αφορά Μήνα</label>
          <select class="fi" id="rpM${n}" style="font-size:12px;padding:7px">
            ${MF.map((m,i)=>`<option value="${new Date().getFullYear()+"-"+String(i+1).padStart(2,"0")}" ${i===new Date().getMonth()?"selected":""}>${m} ${new Date().getFullYear()}</option>`).join("")}
          </select></div>
        <button onclick="window.aRP(${n})" style="width:100%;background:#1A6B3C;color:#fff;border:none;padding:7px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600">+ Πληρωμή</button>
      </div>
      <button onclick="window.sRH(${n})" style="width:100%;background:#1B2A4A;color:#fff;border:none;padding:7px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600">&#128203; Ιστορικό Πληρωμών</button>
    </div>`;
  });
  h+=`</div>
  <div class="card"><div class="stitle">&#128221; Έξοδα Ακινήτων</div>
    <div style="background:#F7F8FA;border-radius:8px;padding:14px;margin-bottom:14px">
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end">
        <div><label class="fl2">Περιγραφή</label><input class="fi" id="reD" placeholder="π.χ. Νερό, Φθορά..."></div>
        <div><label class="fl2">Σπίτι</label><select class="fi" id="reH"><option value="1">Σπίτι 1</option><option value="2">Σπίτι 2</option><option value="3">Σπίτι 3</option><option value="0">Κοινό</option></select></div>
        <div><label class="fl2">Ημερομηνία</label><input class="fi" type="date" id="reDA" value="${td()}"></div>
        <div><label class="fl2">Ποσό (EUR)</label><input class="fi" type="text" id="reA" placeholder="0.00"></div>
      </div>
      <button onclick="window.aRE()" style="margin-top:10px;background:#8B1A1A;color:#fff;border:none;padding:9px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">+ Καταχώρηση Εξόδου</button>
    </div>
    <div style="margin-bottom:8px;font-size:13px;color:#6B7A8D">Σύνολο: <strong style="color:#8B1A1A">${fmt(tE)}</strong></div>
    <div class="tw"><table class="tbl">
      <thead><tr><th>Ημερομηνία</th><th>Σπίτι</th><th>Περιγραφή</th><th style="text-align:right">Ποσό</th><th></th></tr></thead>
      <tbody>${RE.length===0?`<tr><td colspan="5" style="padding:20px;text-align:center;color:#6B7A8D">Δεν υπάρχουν</td></tr>`:""}
        ${[...RE].sort((a,b)=>b.date.localeCompare(a.date)).map((e,i)=>`<tr style="background:${i%2===0?"#fff":"#F7F8FA"}">
          <td>${e.date.split("-").reverse().join("/")}</td>
          <td>${e.houseId==="house_0"?"Κοινό":"Σπίτι "+e.houseId.replace("house_","")}</td>
          <td>${e.category||"-"}</td>
          <td style="text-align:right;font-weight:700;color:#8B1A1A">${fmt(e.amount)}</td>
          <td><button onclick="window.dRE('${e.id}')" style="background:none;border:none;cursor:pointer;color:#ccc">&#128465;</button></td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>`;
  if(rentHist){
    const r=RD.find(r=>r.id==="house_"+rentHist)||{tenant:""};
    const it=RP.filter(p=>p.houseId==="house_"+rentHist).sort((a,b)=>b.date.localeCompare(a.date));
    const tot=it.reduce((s,i)=>s+Number(i.amount),0);
    h+=`<div class="card" style="border:2px solid #1B2A4A">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:14px;font-weight:700;color:#1B2A4A">Σπίτι ${rentHist} — ${r.tenant||""} — Ιστορικό Πληρωμών</div>
        <button onclick="window.cRH()" style="background:#F0F0F0;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:600">&#10005;</button>
      </div>
      <div style="margin-bottom:8px;font-size:13px">Σύνολο: <strong style="color:#1A6B3C">${fmt(tot)}</strong></div>
      <div class="tw"><table class="tbl">
        <thead><tr><th>Ημ. Πληρωμής</th><th>Αφορά</th><th style="text-align:right">Ποσό</th><th></th></tr></thead>
        <tbody>${it.length===0?`<tr><td colspan="4" style="padding:20px;text-align:center;color:#6B7A8D">Δεν υπάρχουν</td></tr>`:""}
          ${it.map((p,i)=>`<tr style="background:${i%2===0?"#fff":"#F7F8FA"}">
            <td>${p.date.split("-").reverse().join("/")}</td>
            <td style="color:#6B7A8D">${p.month?MF[parseInt(p.month.split("-")[1])-1]+" "+p.month.split("-")[0]:"-"}</td>
            <td style="text-align:right;font-weight:700;color:#1A6B3C">${fmt(p.amount)}</td>
            <td><button onclick="window.dRP('${p.id}')" style="background:none;border:none;cursor:pointer;color:#ccc">&#128465;</button></td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>`;
  }
  document.getElementById("v-rents").innerHTML=h;
}
window.tER=async n=>{
  if(editRent===n){
    const t=document.getElementById("eT"+n)?.value.trim()||"";
    const deh=document.getElementById("eDEH"+n)?.value.trim()||"";
    const mr=r2(pA(document.getElementById("eR"+n)?.value||"0"));
    const id="house_"+n;const ex=RD.find(r=>r.id===id)||{id};
    ex.tenant=t;ex.deh=deh;ex.monthlyRent=mr;
    const i=RD.findIndex(r=>r.id===id);if(i>=0)RD[i]=ex;else RD.push(ex);
    await fbs("rents_2026",id,ex);editRent=null;
  }else editRent=n;rRents();
};
window.aRP=async n=>{
  const date=document.getElementById("rpD"+n)?.value,amt=document.getElementById("rpA"+n)?.value;
  const month=document.getElementById("rpM"+n)?.value||date?.slice(0,7);
  if(!date||!amt)return;
  const p={id:uid(),houseId:"house_"+n,date,month,amount:r2(pA(amt))};
  RP.push(p);await fbs("rent_payments_2026",p.id,p);
  document.getElementById("rpA"+n).value="";rRents();
};
window.dRP=async id=>{RP=RP.filter(p=>p.id!==id);await fbd("rent_payments_2026",id);rRents();};
window.sRH=n=>{rentHist=n;rRents();};
window.cRH=()=>{rentHist=null;rRents();};
window.aRE=async()=>{
  const d=document.getElementById("reD")?.value.trim(),h=document.getElementById("reH")?.value;
  const da=document.getElementById("reDA")?.value,a=document.getElementById("reA")?.value;
  if(!d||!da||!a)return;
  const e={id:uid(),houseId:"house_"+h,date:da,category:d,amount:r2(pA(a))};
  RE.push(e);await fbs("rent_expenses_2026",e.id,e);
  document.getElementById("reD").value="";document.getElementById("reA").value="";rRents();
};
window.dRE=async id=>{RE=RE.filter(e=>e.id!==id);await fbd("rent_expenses_2026",id);rRents();};

function rBackup(){
  document.getElementById("v-backup").innerHTML=`<div style="max-width:800px;margin:0 auto"><div class="card">
    <div class="stitle">&#8659; Backup Δεδομένων</div>
    <p style="font-size:13px;color:#6B7A8D;margin-bottom:12px">Κλικ μέσα → Ctrl+A → Ctrl+C → Σημειωματάριο → Αποθήκευση ως backup.json</p>
    <textarea readonly style="width:100%;height:380px;font-family:monospace;font-size:11px;padding:12px;border:1px solid #DDE4ED;border-radius:8px;background:#F7F8FA;resize:vertical" onclick="this.select()">${JSON.stringify(E,null,2)}</textarea>
    <button onclick="window.ST('dashboard')" style="margin-top:12px;padding:8px 16px;border:1px solid #DDE4ED;background:transparent;border-radius:8px;cursor:pointer">&#8592; Πίσω</button>
  </div></div>`;
}
window.importJ=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r2b=new FileReader();
  r2b.onload=async e=>{try{const d=JSON.parse(e.target.result);sm("Εισαγωγή "+d.length+"...","#FFD700");for(const x of d)await fbs(COL,x.id,x);sm("Εισήχθησαν "+d.length,"#90EE90");}catch{alert("Σφάλμα αρχείου");}};
  r2b.readAsText(f);ev.target.value="";
};

window.ST=async function(v){
  curView=v;
  ["dashboard","tax","entries","add","rents","backup"].forEach(n=>{
    const el=document.getElementById("v-"+n);if(el)el.style.display=n===v?"block":"none";
  });
  document.querySelectorAll(".nb").forEach((b,i)=>{b.classList.toggle("on",["dashboard","tax","entries","add","rents"][i]===v);});
  if(v==="dashboard")rDash();
  else if(v==="tax")await rTax();
  else if(v==="entries")rEnt();
  else if(v==="add")rAdd();
  else if(v==="rents"){await loadR();rRents();}
  else if(v==="backup")rBackup();
};

sm("Σύνδεση...","#FFD700");
await seedE();
startL();
</script>
