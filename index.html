<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Λογιστήριο 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#F0F4F8;color:#1A2332}
.bar{background:#1B2A4A;color:#fff;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.logo{font-size:13px;font-weight:700;color:#E8D5A3;cursor:pointer}
.nav{display:flex;gap:3px}
.nb{background:transparent;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.nb.on{background:rgba(255,255,255,.2);font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px}
.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);border:1px solid #DDE4ED;margin-bottom:14px}
.stitle{font-size:11px;font-weight:700;color:#1B2A4A;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #DDE4ED}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{border-radius:10px;padding:12px 14px;border:1px solid}
.sl{font-size:10px;font-weight:700;color:#6B7A8D;text-transform:uppercase;margin-bottom:3px}
.sv{font-size:19px;font-weight:700}
.ss{font-size:11px;color:#6B7A8D;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:7px 10px;background:#1B2A4A;color:#fff;text-align:left;font-size:11px}
.tbl td{padding:6px 10px;border-bottom:1px solid #F0F0F0}
.tbl tr:hover td{background:#F8FAFF}
.tw{border-radius:10px;overflow:hidden;border:1px solid #DDE4ED}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.fi{width:100%;padding:7px 10px;border:1px solid #DDE4ED;border-radius:7px;font-size:13px;outline:none;background:#fff}
.fi:focus{border-color:#1B2A4A}
.fl{font-size:11px;font-weight:600;color:#6B7A8D;text-transform:uppercase;display:block;margin-bottom:3px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fu{grid-column:1/-1}
.pls{display:flex;gap:4px;flex-wrap:wrap}
.pl{padding:3px 9px;border-radius:20px;border:1px solid #DDE4ED;background:transparent;color:#6B7A8D;cursor:pointer;font-size:11px}
.pl.an{border-color:#1B2A4A;background:#1B2A4A;color:#fff}
.pl.ag{border-color:#1A6B3C;background:#1A6B3C;color:#fff}
.pl.ar{border-color:#8B1A1A;background:#8B1A1A;color:#fff}
.tb{flex:1;padding:9px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;border:2px solid #DDE4ED;background:#fff;color:#6B7A8D}
.tb.ex{border-color:#8B1A1A;background:#FDF0F0;color:#8B1A1A}
.tb.es{border-color:#1A6B3C;background:#E8F5EE;color:#1A6B3C}
.sb{background:#1A6B3C;color:#fff;border:none;padding:9px 20px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:700;margin-top:12px}
.er{margin-top:6px;padding:7px 10px;background:#FDF0F0;border:1px solid #F0C0C0;border-radius:7px;color:#8B1A1A;font-size:12px;font-weight:600;display:none}
.ok-b{margin-bottom:10px;padding:10px 14px;background:#D4EDDA;border:1px solid #A8D5BA;border-radius:8px;display:none;align-items:center;gap:10px}
.xb{background:#FDF0F0;border:1px solid #EDBBBB;color:#8B1A1A;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700;padding:2px 7px}
.xb:hover{background:#8B1A1A;color:#fff}
.po{position:fixed;top:0;left:0;width:100%;height:100%;background:#1B2A4A;z-index:9999;display:flex;align-items:center;justify-content:center}
.pb{background:#fff;border-radius:18px;padding:32px;text-align:center;width:300px}
.pi{width:100%;padding:10px;font-size:24px;font-weight:700;letter-spacing:8px;border:2px solid #DDE4ED;border-radius:8px;text-align:center;outline:none;margin-bottom:16px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}
.pkb{padding:14px;border:2px solid #DDE4ED;border-radius:8px;background:#fff;font-size:18px;font-weight:700;cursor:pointer}
.pkb:active{background:#1B2A4A;color:#fff}
.pkb.dl{color:#8B1A1A;font-size:14px}
.pkb.ok2{background:#1B2A4A;color:#fff}
.pe{color:#8B1A1A;font-size:12px;font-weight:600;min-height:16px;margin-top:3px}
.dc{padding:10px 18px 12px;background:#F7F8FA;border-bottom:1px solid #E0E0E0}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;max-width:580px}
.dlb{font-size:10px;font-weight:600;color:#6B7A8D;text-transform:uppercase;display:block;margin-bottom:1px}
.ddw{position:relative}
.ddt{width:100%;padding:7px 10px;border:1px solid #DDE4ED;border-radius:7px;font-size:13px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.ddm{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid #DDE4ED;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.1);z-index:200;max-height:320px;display:none;flex-direction:column}
.ddm.op{display:flex}
.dds{padding:5px 7px 2px}.dds input{width:100%;padding:5px 8px;border:1px solid #DDE4ED;border-radius:5px;font-size:12px;outline:none}
.ddl{overflow-y:auto;flex:1}
.ddi{padding:6px 10px;font-size:13px;cursor:pointer}.ddi:hover{background:#EBF2FB}
.ddf{border-top:1px solid #DDE4ED;padding:4px 7px}
.dda{padding:5px 10px;font-size:13px;cursor:pointer;color:#1A6B3C;font-weight:600}.dda:hover{background:#E8F5EE}
.ddn{display:flex;gap:5px}
.ddni{flex:1;padding:5px 8px;border:1px solid #DDE4ED;border-radius:5px;font-size:12px;outline:none}
.ddok{padding:4px 8px;background:#1A6B3C;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600}
.ddcx{padding:4px 7px;background:transparent;border:1px solid #DDE4ED;border-radius:5px;cursor:pointer}
.cw{display:flex;gap:5px}
.cp{padding:7px 10px;background:#EBF2FB;color:#1A4E8B;border:1px solid #BDD4F0;border-radius:7px;cursor:pointer;font-weight:700}
.smsg{font-size:11px}
.btn{padding:4px 10px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.bbl{background:#1967D2;color:#fff}.bgd{background:#B8860B;color:#fff}
.mb{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:8px}
.mc{flex:1;display:flex;flex-direction:column;align-items:center}
.mbs{width:100%;display:flex;gap:1px;align-items:flex-end;height:42px}
.bi{flex:1;background:#1A6B3C;border-radius:2px 2px 0 0;opacity:.8}
.be2{flex:1;background:#C0392B;border-radius:2px 2px 0 0;opacity:.7}
.ml{font-size:7px;color:#6B7A8D;margin-top:1px}
@media(max-width:680px){.g4,.g3,.g2,.fg{grid-template-columns:1fr}.fu{grid-column:1}.nav .nb{font-size:10px;padding:4px 6px}}
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ── FIREBASE ──────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyB4U9JT51XYBoBxuKC0EH7_ccbgsU9n9Z4",
  authDomain:"logistirio-31bf5.firebaseapp.com",
  projectId:"logistirio-31bf5"
});
var db = firebase.firestore();
var COL = "entries_2026";

// ── CONSTANTS ─────────────────────────────────────────────
var MF=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
var MS=["Ιαν","Φεβ","Μαρ","Απρ","Μαι","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
var ACTS=["Κατοικία","Consulting","Εκτός Δραστηριότητας"];
var CATS={
  "Κατοικία":{"Έξοδο":["Ρεύμα","Νερό","Internet","Πισίνα","Καθαρισμός","Κλινοσκεπάσματα","Συντήρηση","Ασφάλεια","Φόρος/Τέλη","Αγορά Εμπορεύματος","Διάφορα"],"Έσοδο":["Ενοίκιο","Προκαταβολή","Λοιπά"]},
  "Consulting":{"Έξοδο":["Τηλεφωνία","Μεταφορικά","Εξοπλισμός","Συνδρομές","Επαγγελματικές Υπηρεσίες","Αγορά Εμπορεύματος","Διάφορα"],"Έσοδο":["Αμοιβή","Προκαταβολή","Λοιπά"]},
  "Εκτός Δραστηριότητας":{"Έξοδο":["Αγορά","ΦΠΑ","Διάφορα"],"Έσοδο":["Λοιπά"]}
};
var QS=[
  {id:"Q1",label:"Α' Τρίμηνο",months:[0,1,2],deadline:"26 Απρ 2026"},
  {id:"Q2",label:"Β' Τρίμηνο",months:[3,4,5],deadline:"26 Ιουλ 2026"},
  {id:"Q3",label:"Γ' Τρίμηνο",months:[6,7,8],deadline:"26 Οκτ 2026"},
  {id:"Q4",label:"Δ' Τρίμηνο",months:[9,10,11],deadline:"26 Ιαν 2027"},
];

// ── STATE ─────────────────────────────────────────────────
var E = [];
var RD=[],RP=[],RE=[];
var filt={act:"Όλες",tp:"Όλοι",mon:"Όλοι",sup:""};
var exp={};
var view="dashboard";
var fType="Έξοδο",fAct="Κατοικία",fInv=false,ddSup="";
var extraCats={},extraSups=[];
var rentHist=null,editRent=null;

// ── UTILS ─────────────────────────────────────────────────
function r2(n){return Math.round(Number(n||0)*100)/100;}
function fmt(n){return r2(n).toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";}
function uid(){return "e"+Date.now()+Math.random().toString(36).slice(2,5);}
function pA(s){return parseFloat(String(s||0).replace(",","."))||0;}
function td(){return new Date().toISOString().slice(0,10);}
function sups(){
  // Get current category from form
  var cat = ge("fC") ? ge("fC").value : "";
  var base = fType==="Έξοδο" ? extraSups : extraClients;
  // If category selected, show suppliers used in that category
  // Always include manually added names
  var fromE = E.filter(function(e){
    if(e.type !== fType) return false;
    if(cat && e.category !== cat) return false;
    return e.supplier;
  }).map(function(e){return e.supplier;});
  return [...new Set([...fromE,...base])].filter(Boolean).sort();
}
function allSups(){return[...new Set([...E.map(function(e){return e.supplier;}).filter(Boolean),...extraSups,...extraClients])].sort();}
function sm(msg,col){var el=document.getElementById("smsg");if(!el)return;el.textContent=msg;el.style.color=col||"#fff";if(msg)setTimeout(function(){el.textContent="";},3000);}
function ge(id){return document.getElementById(id);}

// ── LOAD FROM FIRESTORE ───────────────────────────────────
function loadAndRender(){
  db.collection(COL).get().then(function(snap){
    E = snap.docs.map(function(d){return d.data();}).sort(function(a,b){return a.date.localeCompare(b.date);});
    if(view==="dashboard") rDash();
    else if(view==="entries") rEnt();
  });
}

// ── DELETE ────────────────────────────────────────────────
function delEntry(id, desc){
  if(!confirm("Διαγραφή:\n\"" + desc + "\"")) return;
  // 1. Αφαίρεση από local πίνακα και άμεσο render
  E = E.filter(function(e){ return e.id !== id; });
  if(view==="entries") rEnt();
  if(view==="dashboard") rDash();
  // 2. Διαγραφή από Firebase στο background
  db.collection(COL).doc(id).delete()
    .then(function(){ sm("Διαγράφηκε","#90EE90"); })
    .catch(function(e){ alert("Σφάλμα: " + e.message); });
}

// ── SEED ─────────────────────────────────────────────────
function seedE(){
  db.collection("settings").doc("seeded").get().then(function(d){
    if(d.exists) return;
    db.collection("settings").doc("seeded").set({done:true});
    // Δεν βάζουμε seed data - ο χρήστης θα τα καταχωρήσει μόνος του
  });
}

// ── AGGREGATES ────────────────────────────────────────────
function agg(){
  var kI=0,kE=0,cI=0,cE=0,cG=0,cW=0;
  E.forEach(function(e){
    var a=Number(e.amount||0);
    if(e.activity==="Κατοικία"&&e.type==="Έσοδο") kI+=a;
    if(e.activity==="Κατοικία"&&e.type==="Έξοδο") kE+=a;
    if(e.activity==="Consulting"&&e.type==="Έσοδο"){cI+=a;cG+=Number(e.totalInvoice||0);cW+=Number(e.withholding||0);}
    if(e.activity==="Consulting"&&e.type==="Έξοδο") cE+=a;
  });
  return{kI:r2(kI),kE:r2(kE),cI:r2(cI),cE:r2(cE),cG:r2(cG),cW:r2(cW),net:r2((kI-kE)+(cI-cE))};
}

function mbar(act){
  var d=MS.map(function(_,i){
    var inc=0,exp=0;
    E.forEach(function(e){
      if(e.activity!==act) return;
      var m=new Date(e.date).getMonth(),a=Number(e.amount||0);
      if(m===i&&e.type==="Έσοδο") inc+=a;
      if(m===i&&e.type==="Έξοδο") exp+=a;
    });
    return{i:inc,e:exp};
  });
  var mx=1;d.forEach(function(x){if(x.i>mx)mx=x.i;if(x.e>mx)mx=x.e;});
  return '<div class="mb">'+d.map(function(x,i){
    return '<div class="mc"><div class="mbs"><div class="bi" style="height:'+(x.i/mx*100)+'%"></div><div class="be2" style="height:'+(x.e/mx*100)+'%"></div></div><div class="ml">'+MS[i]+'</div></div>';
  }).join('')+'</div>';
}

function sc(bg,bc,label,val,col,sub){
  return '<div class="sc" style="background:'+bg+';border-color:'+bc+'"><div class="sl">'+label+'</div><div class="sv" style="color:'+col+'">'+val+'</div>'+(sub?'<div class="ss">'+sub+'</div>':'')+'</div>';
}

// ── DASHBOARD ─────────────────────────────────────────────
function rDash(){
  var a=agg();
  ge("v-dashboard").innerHTML=
    '<div class="g4" style="margin-bottom:14px">'+
      sc("#EBF2FB","#BDD4F0","Έσοδα Κατοικίας",fmt(a.kI),"#1A4E8B","")+
      sc("#F0EAFB","#C9B0F0","Consulting Ακαθ.",fmt(a.cG),"#5B2C8B","Παρακ.: "+fmt(a.cW)+" | Εισπρ.: "+fmt(a.cI))+
      sc("#FDF0F0","#F0C0C0","Συνολικά Έξοδα",fmt(a.kE+a.cE),"#8B1A1A","Κατοικία: "+fmt(a.kE)+" | Consulting: "+fmt(a.cE))+
      sc(a.net>=0?"#E8F5EE":"#FDF0F0",a.net>=0?"#A8D5BA":"#F0C0C0","Καθαρό",fmt(a.net),a.net>=0?"#1A6B3C":"#8B1A1A","")+
    '</div>'+
    '<div class="g2" style="margin-bottom:14px">'+
      '<div class="card"><div class="stitle">🏠 Κατοικία</div>'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'+
          '<div><div style="font-size:10px;color:#6B7A8D">Έσοδα</div><div style="font-size:18px;font-weight:700;color:#1A6B3C">'+fmt(a.kI)+'</div></div>'+
          '<div style="text-align:right"><div style="font-size:10px;color:#6B7A8D">Έξοδα</div><div style="font-size:18px;font-weight:700;color:#8B1A1A">'+fmt(a.kE)+'</div></div>'+
        '</div>'+
        '<div style="background:'+(a.kI-a.kE>=0?"#E8F5EE":"#FDF0F0")+';border-radius:6px;padding:5px 10px;text-align:center;margin-bottom:6px">'+
          '<span style="font-weight:700;color:'+(a.kI-a.kE>=0?"#1A6B3C":"#8B1A1A")+'">Καθαρό: '+fmt(a.kI-a.kE)+'</span>'+
        '</div>'+mbar("Κατοικία")+
      '</div>'+
      '<div class="card"><div class="stitle">💼 Consulting</div>'+
        '<div style="background:#F0EAFB;border:1px solid #C9B0F0;border-radius:7px;padding:9px;margin-bottom:9px">'+
          '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">'+
            '<div><div style="font-size:9px;color:#6B7A8D">Ακαθάριστο</div><div style="font-size:13px;font-weight:700;color:#5B2C8B">'+fmt(a.cG)+'</div></div>'+
            '<div><div style="font-size:9px;color:#6B7A8D">Παρακράτηση</div><div style="font-size:13px;font-weight:700;color:#8B1A1A">'+fmt(a.cW)+'</div></div>'+
            '<div><div style="font-size:9px;color:#6B7A8D">Εισπράχθηκε</div><div style="font-size:13px;font-weight:700;color:#1A6B3C">'+fmt(a.cI)+'</div></div>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px">'+
          '<div><div style="font-size:10px;color:#6B7A8D">Έξοδα</div><div style="font-size:16px;font-weight:700;color:#8B1A1A">'+fmt(a.cE)+'</div></div>'+
          '<div style="text-align:right"><div style="font-size:10px;color:#6B7A8D">Καθαρό</div><div style="font-size:16px;font-weight:700;color:'+(a.cI-a.cE>=0?"#1A6B3C":"#8B1A1A")+'">'+fmt(a.cI-a.cE)+'</div></div>'+
        '</div>'+mbar("Consulting")+
      '</div>'+
    '</div>';
}

// ── TAX ───────────────────────────────────────────────────
function getVD(cb){db.collection("settings").doc("vat_p").get().then(function(d){cb(d.exists?d.data().p||[]:[]);}).catch(function(){cb([]);});}
function saveVD(p,cb){db.collection("settings").doc("vat_p").set({p:p}).then(cb||function(){});}

function rTax(){
  ge("v-tax").innerHTML="<div style='padding:30px;text-align:center;color:#6B7A8D'>Φόρτωση...</div>";
  getVD(function(vd){
    var qd=QS.map(function(q){
      var de=vd.filter(function(p){return p.qid===q.id&&p.type==="due";})[0];
      var rd=de?Number(de.amount):null;
      var py=vd.filter(function(p){return p.qid===q.id&&p.type==="payment";});
      var tp=py.reduce(function(s,p){return s+Number(p.amount);},0);
      var ar=!!vd.filter(function(p){return p.qid===q.id&&p.type==="archived";})[0];
      var vO=E.filter(function(e){return e.type==="Έσοδο"&&q.months.indexOf(new Date(e.date).getMonth())>=0;}).reduce(function(s,e){return s+Number(e.vat||0);},0);
      var vI=E.filter(function(e){return e.type==="Έξοδο"&&q.months.indexOf(new Date(e.date).getMonth())>=0;}).reduce(function(s,e){return s+Number(e.vat||0);},0);
      var rm=rd!==null?r2(rd-tp):null;
      return Object.assign({},q,{rd:rd,tp:r2(tp),py:py,ar:ar,vO:r2(vO),vI:r2(vI),cd:r2(vO-vI),rm:rm});
    });
    var aq=qd.filter(function(q){return !q.ar&&q.rd!==null;})[0]||qd.filter(function(q){return !q.ar;})[0]||qd[1];
    var nqi=qd.indexOf(aq)+1;
    var nq=nqi<qd.length?qd[nqi]:null;
    var h='<div style="max-width:880px">';
    h+='<div class="card" style="border:2px solid #E8D080"><div class="stitle">'+aq.label+' 2026 — Προθεσμία '+aq.deadline+'</div>'+
      '<div class="g3" style="margin-bottom:12px">'+
        sc("#FDF0F0","#F0C0C0","ΦΠΑ Εκροών",fmt(aq.vO),"#8B1A1A","Από έσοδα")+
        sc("#E8F5EE","#A8D5BA","ΦΠΑ Εισροών",fmt(aq.vI),"#1A6B3C","Από έξοδα")+
        sc("#FFF8E8","#E8D080","Χρεωστικό",fmt(Math.abs(aq.cd)),"#B8860B","")+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;align-items:start">'+
        '<div><label class="fl">Δηλωθέν ΦΠΑ εφορίας (EUR)</label>'+
          '<input class="fi" type="text" id="vdue" placeholder="0.00" value="'+(aq.rd!==null?aq.rd:"")+'" onblur="sQD(\''+aq.id+'\',this.value)" style="font-size:16px;font-weight:700;border-color:#E8D080">'+
        '</div>'+

function sQD(qid,val){getVD(function(p){var i=p.findIndex(function(x){return x.qid===qid&&x.type==="due";});var e={qid:qid,type:"due",amount:pA(val),date:td()};if(i>=0)p[i]=e;else p.push(e);saveVD(p,function(){rTax();});});}

function dQP(qid,idx){getVD(function(p){var py=p.filter(function(x){return x.qid===qid&&x.type==="payment";});var rm=py[idx];saveVD(p.filter(function(x){return x!==rm;}),function(){rTax();});});}

      '<thead><tr><th style="width:34px">✕</th><th>Ημερομηνία</th><th>Δραστ.</th><th>Τύπος</th><th>Προμηθευτής / Περιγραφή</th><th style="text-align:right">ΦΠΑ</th><th style="text-align:right">Ποσό</th></tr></thead>'+

function setType(t){

function onAct(){fAct=ge("fA").value;uC();uP();}
function uC(){
  var cats=(CATS[fAct]&&CATS[fAct][fType]||[]).concat((extraCats[fAct]&&extraCats[fAct][fType])||[]);
  var s=ge("fC");if(!s)return;

function acat(){var n=prompt("Νέα κατηγορία:");if(!n||!n.trim())return;if(!extraCats[fAct])extraCats[fAct]={};if(!extraCats[fAct][fType])extraCats[fAct][fType]=[];extraCats[fAct][fType].push(n.trim());uC();if(ge("fC"))ge("fC").value=n.trim();}

function uP(){
  var entered=pA(ge("fAV")?ge("fAV").value:"");
  var vp=parseInt(ge("fV")?ge("fV").value:"24");
  var whCh=ge("fWH")&&ge("fWH").checked;
  var whA=whCh?pA(ge("fWHamt")?ge("fWHamt").value:""):0;
  var box=ge("pB");if(!box)return;
  if(entered<=0){box.style.display="none";return;}
  box.style.display="block";
  var net=r2(entered/(1+vp/100));
  var vatA=r2(entered-net);
  var finalA=r2(entered-whA);
  if(fType==="Έξοδο"){
    box.style.cssText="grid-column:1/-1;background:#FDF0F0;border:1px solid #F0C0C0;border-radius:7px;padding:9px 12px";
    box.innerHTML='<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+
      '<span style="font-size:12px;color:#6B7A8D">Καθαρή: <strong>'+fmt(net)+'</strong></span>'+
      '<span style="font-size:12px;color:#6B7A8D">ΦΠΑ '+vp+'%: <strong style="color:#1A4E8B">'+fmt(vatA)+'</strong></span>'+
      '<span style="font-size:14px;font-weight:700;color:#8B1A1A;margin-left:auto">Καταχωρείται: '+fmt(finalA)+'</span></div>';
  }else{
    box.style.cssText="grid-column:1/-1;background:#E8F5EE;border:1px solid #A8D5BA;border-radius:7px;padding:9px 12px";
    box.innerHTML='<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+

function tER(n){
  if(editRent===n){
    var t=ge("eT"+n).value.trim()||"",deh=ge("eDEH"+n).value.trim()||"",mr=r2(pA(ge("eR"+n).value||"0"));
    var id="house_"+n,ex=RD.filter(function(r){return r.id===id;})[0]||{id:id};
    ex.tenant=t;ex.deh=deh;ex.monthlyRent=mr;
    var i=RD.findIndex(function(r){return r.id===id;});if(i>=0)RD[i]=ex;else RD.push(ex);
    db.collection("rents_2026").doc(id).set(ex).then(function(){editRent=null;rRents();});
  }else{editRent=n;rRents();}
}
function aRP(n){
  var date=ge("rpD"+n).value,amt=ge("rpA"+n).value,month=ge("rpM"+n).value||date.slice(0,7);
  if(!date||!amt)return;
  var p={id:uid(),houseId:"house_"+n,date:date,month:month,amount:r2(pA(amt))};
  db.collection("rent_payments_2026").doc(p.id).set(p).then(function(){RP.push(p);ge("rpA"+n).value="";rRents();});
}
function dRP(id){db.collection("rent_payments_2026").doc(id).delete().then(function(){RP=RP.filter(function(p){return p.id!==id;});rRents();});}

function aRE(){

  var e={id:uid(),houseId:"house_"+h,date:da,category:d,amount:r2(pA(a))};

function dRE(id){db.collection("rent_expenses_2026").doc(id).delete().then(function(){RE=RE.filter(function(e){return e.id!==id;});rRents();});}

function ST(v){
  view=v;
  ["dashboard","tax","entries","add","rents","backup"].forEach(function(n){
    var el=ge("v-"+n);if(el)el.style.display=n===v?"block":"none";
  });
  document.querySelectorAll(".nb").forEach(function(b,i){
    b.classList.toggle("on",["dashboard","tax","entries","add","rents"][i]===v);
  });
  if(v==="dashboard") rDash();

  else if(v==="entries") rEnt();

}

    <div style="font-size:11px;color:#6B7A8D;margin-bottom:16px">Νίκος Ζουμπουλάκης</div>
    <input class="pi" id="pi" type="password" maxlength="6" inputmode="numeric" placeholder="• • • • • •" autocomplete="off" oninput="pic(this.value)" onkeydown="if(event.key==='Enter')pc()">
    <div class="pg">
      <button class="pkb" onclick="pp(1)">1</button><button class="pkb" onclick="pp(2)">2</button><button class="pkb" onclick="pp(3)">3</button>
      <button class="pkb" onclick="pp(4)">4</button><button class="pkb" onclick="pp(5)">5</button><button class="pkb" onclick="pp(6)">6</button>
      <button class="pkb" onclick="pp(7)">7</button><button class="pkb" onclick="pp(8)">8</button><button class="pkb" onclick="pp(9)">9</button>
      <button class="pkb dl" onclick="pd()">⌫</button><button class="pkb" onclick="pp(0)">0</button><button class="pkb ok2" onclick="pc()">OK</button>
    </div>
    <div class="pe" id="pe"></div>
  </div>
</div>

<div class="bar">
  <div class="logo" onclick="changeYear()">ΝΙΚΟΣ ΖΟΥΜΠΟΥΛΑΚΗΣ — Λογιστήριο <span id="yr">2026</span></div>
  <div class="nav">
    <button class="nb on" onclick="ST('dashboard')">📊 Dashboard</button>
    <button class="nb" onclick="ST('tax')">📋 Φορολογικά</button>
    <button class="nb" onclick="ST('entries')">📋 Εγγραφές</button>
    <button class="nb" onclick="ST('add')">➕ Νέα Εγγραφή</button>
    <button class="nb" onclick="ST('rents')">🏘 Ενοίκια</button>
  </div>
  <div style="display:flex;gap:5px;align-items:center">
    <span class="smsg" id="smsg"></span>
    <input type="file" id="ifile" accept=".json" style="display:none" onchange="importJ(event)">
    <button class="btn bbl" onclick="document.getElementById('ifile').click()">📂 Import</button>
    <button class="btn bgd" onclick="ST('backup')">⬇ Backup</button>
  </div>
</div>

<div class="wrap">
  <div id="v-dashboard"></div>
  <div id="v-tax" style="display:none"></div>
  <div id="v-entries" style="display:none"></div>
  <div id="v-add" style="display:none"></div>
  <div id="v-rents" style="display:none"></div>
  <div id="v-backup" style="display:none"></div>
</div>

</body>
</html>
